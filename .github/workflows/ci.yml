name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: install
        run: npm ci

      - name: test
        run: npm test

      # The bin stub imports dist/, so building here is what proves the
      # published entry point actually resolves on every platform.
      - name: build and run the console script
        run: npm run build && node bin/bundle-forensics.js summary fixtures/esbuild/app-before.json

  quality:
    name: types, lint and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      - name: tsc --noEmit (strict)
        run: npm run typecheck

      - name: eslint
        run: npm run lint

      # vitest.config.ts fails the run below 95% on any of the four metrics.
      - name: coverage
        run: npm run coverage

  dogfood:
    name: analyse a committed metafile with the built CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install and build
        run: npm ci && npm run build

      # Exercises the real console script end to end and pins its exact
      # output, including the column alignment and the claim that
      # deduplicating object-assign would save 1.8 kB.
      - name: duplicates output is exactly as documented
        run: |
          set -euo pipefail
          actual=$(node bin/bundle-forensics.js duplicates fixtures/esbuild/app-before.json | tr -d '\r')
          expected=$'object-assign  3.7 kB in 2 copies, 1.8 kB recoverable\n\ninstall root                                          size  modules\n--------------------------------------------------  ------  -------\nnode_modules/classnames/node_modules/object-assign  1.9 kB        1\nnode_modules/object-assign                          1.8 kB        1'
          if [ "$actual" != "$expected" ]; then
            echo "unexpected output:"; echo "$actual"; exit 1
          fi

      # The size budget is the feature CI users will actually depend on,
      # so both of its exit codes are asserted rather than assumed.
      - name: --fail-on-growth exits 3 over budget and 0 under it
        run: |
          set -euo pipefail
          set +e
          node bin/bundle-forensics.js diff fixtures/esbuild/app-before.json \
            fixtures/esbuild/app-after.json --fail-on-growth 1000 >/dev/null 2>&1
          over=$?
          node bin/bundle-forensics.js diff fixtures/esbuild/app-before.json \
            fixtures/esbuild/app-after.json --fail-on-growth 20000 >/dev/null
          under=$?
          set -e
          echo "over budget exit=$over, under budget exit=$under"
          test "$over" = "3"
          test "$under" = "0"

      # `npm ci --omit=dev` turned out to be the wrong probe for this: on
      # the runner it left the dev tree in place ("up to date" against the
      # lockfile) and the emptiness assertion failed against devDependencies
      # it was never meant to test. The honest form of the claim needs no
      # npm at all: with node_modules deleted outright, the built CLI must
      # run from its dist output and node builtins alone.
      - name: the tool has no runtime dependencies to install
        run: |
          set -euo pipefail
          rm -rf node_modules
          node -e "const d = Object.keys(require('./package.json').dependencies || {}); if (d.length) { console.error('runtime dependencies declared:', d); process.exit(1); }"
          node bin/bundle-forensics.js --version
          node bin/bundle-forensics.js duplicates fixtures/esbuild/app-before.json > /dev/null
